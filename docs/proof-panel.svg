    <line x1="76" y1="292" x2="1124" y2="292" stroke="#293234"/><text x="92" y="324">Duplicate refund</text><text x="566" y="324" font-family="monospace">1</text><text x="681" y="324" font-family="monospace">1</text><text x="790" y="324" font-family="monospace">₹1,250.00</text><text x="930" y="324" font-family="monospace">₹1,250.00</text><text x="1060" y="324" fill="#90e75b">✓ Match</text>
    <line x1="76" y1="346" x2="1124" y2="346" stroke="#293234"/><text x="92" y="378">Rounding leak</text><text x="566" y="378" font-family="monospace">1</text><text x="681" y="378" font-family="monospace">1</text><text x="790" y="378" font-family="monospace">₹2.00</text><text x="930" y="378" font-family="monospace">₹2.00</text><text x="1060" y="378" fill="#90e75b">✓ Match</text>
  </g>
  <line x1="76" y1="415" x2="1124" y2="415" stroke="#293234"/>
  <g font-family="monospace" font-size="15"><text x="92" y="458" fill="#f2c879">₹ delayed</text><text x="205" y="458" fill="#f4f7f7">₹3,500.00</text><text x="500" y="458" fill="#f2c879">₹ leaked</text><text x="610" y="458" fill="#f4f7f7">₹1,327.00</text></g>
