<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">ReconZero planted versus caught proof panel</title>
  <desc id="desc">A dark ReconZero proof panel comparing planted and caught anomalies, with separate delayed and leaked totals.</desc>
  <rect width="1200" height="650" fill="#0d1114"/>
